# Re-opens the shared Product type (declared in silvershop-suite/api-graphql's _graphql/types.yml) to add the
# `colours` field, and defines the nested ShopColour type. Field names mirror SilverShop\Api\Enrichment\
# ColorProductEnrichment ($data['colours']) key-for-key, so GraphQL's default array field-resolver maps the REST
# serializer's output with no PHP. silverstripe/graphql merges the field into the single Product type
# (Type::mergeWith). Only read when the overlay is installed (see _config/graphql.yml guard).

# Adds Product.colours — rides SilverShop\Api\Enrichment\ColorProductEnrichment
Product:
  fields:
    colours: '[ShopColour]'

# One row of SilverShop\Api\Enrichment\ColorProductEnrichment — {id, title, hex}
ShopColour:
  fields:
    id: Int
    title: String
    hex: String
